{% extends 'learning_logs/base.html' %}

{% load django_bootstrap5 %}

{% block content %}

<h2>Edit Entry</h2>

<form action="{% url 'learning_logs:edit_entry' entry.id %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Save Changes" %}
</form>

{% endblock content %}
