{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evaline's Learning Log</title>
    {% bootstrap_css %}
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 border">
    <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'learning_logs:index' %}">
            Evaline's Learning Log
        </a>

        <div>
            <a class="nav-link d-inline" href="{% url 'learning_logs:topics' %}">
                Topics
            </a>

            <a class="nav-link d-inline" href="{% url 'learning_logs:new_topic' %}">
                New Topic
            </a>

            {% if user.is_authenticated %}
                <span class="nav-link d-inline">
                    Hello, {{ user.username }}
                </span>

                <form action="{% url 'accounts:logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-outline-secondary btn-sm">
                        Log out
                    </button>
                </form>

            {% else %}
                <a class="nav-link d-inline" href="{% url 'accounts:login' %}">
                    Log in
                </a>

                <a class="nav-link d-inline" href="{% url 'accounts:register' %}">
                    Register
                </a>
            {% endif %}
        </div>

    </div>
</nav>

<main class="container">
    {% block content %}{% endblock content %}
</main>

{% bootstrap_javascript %}
</body>
</html>
