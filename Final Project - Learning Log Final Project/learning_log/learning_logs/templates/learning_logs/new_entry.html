{% extends 'learning_logs/base.html' %}

{% load django_bootstrap5 %}

{% block content %}

<h2>{{ topic }}</h2>
<p>Add a new entry:</p>

<form action="{% url 'learning_logs:new_entry' topic.id %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Add Entry" %}
</form>

{% endblock content %}
